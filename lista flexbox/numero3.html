<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>questão 3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background-color: #a8a8a8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }


        .container {
            background-color: #fff;
            width: 350px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }


        .user-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f0;
        }


        .user-item:last-child {
            border-bottom: none;
        }


        .user-photo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-right: 15px;
            object-fit: cover;
        }


        .user-info {
            display: flex;
            flex-direction: column;
        }


        .user-name {
            font-weight: bold;
            color: #444;
            font-size: 16px;
            margin-bottom: 2px;
        }


        .user-address {
            color: #999;
            font-size: 13px;
        }
    </style>
</head>
<body>


    <div class="container">
        <div class="user-item">
            <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Linda" class="user-photo">
            <div class="user-info">
                <span class="user-name">Linda Hart</span>
                <span class="user-address">6765 Shady Ln Dr</span>
            </div>
        </div>


        <div class="user-item">
            <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Roger" class="user-photo">
            <div class="user-info">
                <span class="user-name">Roger Medina</span>
                <span class="user-address">2420 Paddock Way</span>
            </div>
        </div>


        <div class="user-item">
            <img src="https://randomuser.me/api/portraits/men/1.jpg" alt="Dean" class="user-photo">
            <div class="user-info">
                <span class="user-name">Dean Sullivan</span>
                <span class="user-address">6727 Airplane Ave</span>
            </div>
        </div>


        <div class="user-item">
            <img src="https://randomuser.me/api/portraits/women/68.jpg" alt="Elizabeth" class="user-photo">
            <div class="user-info">
                <span class="user-name">Elizabeth Austin</span>
                <span class="user-address">6685 Blossom Hill Rd</span>
            </div>
        </div>
    </div>


</body>
</html>
