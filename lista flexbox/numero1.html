<!-- nivel 12:
   Propriedades: flex-direction: column-reverse;
   Explicação: Esta propriedade muda o eixo principal para vertical e inverte
   a ordem dos elementos. Como a vitória-régia vermelha está no topo e o
   sapo vermelho é o último no código, o 'column-reverse' coloca o final
   da lista no topo do container.


   nivel 13:
   Propriedades: flex-direction: row-reverse; justify-content: center; align-items: flex-end;
   Explicação: Aqui usamos três propriedades. 'row-reverse' para inverter a
   ordem horizontal dos sapos, 'justify-content: center' para centralizá-los
   no eixo principal, e 'align-items: flex-end' para empurrá-los para a
   base do container, onde estão as vitórias-régias.-->
