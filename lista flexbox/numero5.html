<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>questão 5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }


        .container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
            gap: 10px;
        }


        header, footer {
            background-color: #a6ce39;
            height: 100px;
            display: flex;
            align-items: center;
            padding-left: 20px;
            font-weight: bold;
        }


        .main-content {
            display: flex;
            flex: 1;
            gap: 10px;
        }


        article {
            flex: 3;
            background-color: #ffffff;
            border: 1px solid #eee;
            padding: 20px;
            font-weight: bold;
        }


        aside {
            flex: 1;
            background-color: #f9f7e8;
            padding: 20px;
            font-weight: bold;
        }


        nav {
            flex: 1;
            background-color: #e2ede1;
            padding: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>


    <div class="container">
        <header>Header</header>


        <div class="main-content">
            <article>Article</article>
            <aside>Aside</aside>
            <nav>Nav</nav>
        </div>


        <footer>Footer</footer>
    </div>


</body>
</html>
