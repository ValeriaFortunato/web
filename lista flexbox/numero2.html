<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>questão 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffffff;
        }


        .card {
            width: 300px;
            height: 550px;
            border: 3px solid #bc00ff;
            background-color: #fff;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }


        .logo {
            color: #b5b5b5;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }


        .linhas {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: -60px;
        }


        .linha {
            width: 100%;
            height: 22px;
            background-color: #e8e8e8;
        }


        .footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }


        .circulo {
            width: 80px;
            height: 80px;
            background-color: #e8e8e8;
            border-radius: 50%;
        }


        .retangulo {
            width: 110px;
            height: 28px;
            background-color: #e8e8e8;
        }
    </style>
</head>
<body>


    <div class="card">
        <div class="logo">Company Logo</div>


        <div class="linhas">
            <div class="linha"></div>
            <div class="linha"></div>
            <div class="linha"></div>
            <div class="linha"></div>
        </div>


        <div class="footer">
            <div class="circulo"></div>
            <div class="retangulo"></div>
        </div>
    </div>


</body>
</html>
