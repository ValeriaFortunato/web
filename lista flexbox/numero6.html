<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>questão 6</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            width: 100vw;
            height: 100vh;
            display: flex;
        }


        .grid-container {
            display: grid;
            width: 100%;
            height: 100%;
            gap: 10px;
            padding: 10px;
            grid-template-columns: 2fr 1.5fr 2fr 0.6fr;
            grid-template-rows: 1.5fr 1fr 1fr;
        }


        .box {
            display: flex;
            align-items: center;
            justify-content: center;
        }


        .item1 { background-color: #ff9f1c; grid-column: 1; grid-row: 1; }
        .item2 { background-color: #bcd2e8; grid-column: 1; grid-row: 2; }
        .item3 { background-color: #ffbf47; grid-column: 1 / span 2; grid-row: 3; }
        .item4 { background-color: #f4bcae; grid-column: 2; grid-row: 1 / span 2; }
        .item5 { background-color: #d1e5e3; grid-column: 3; grid-row: 1; }
        .item6 { background-color: #b8d078; grid-column: 3; grid-row: 2 / span 2; }


        .circles {
            grid-column: 4;
            grid-row: 1 / span 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
            align-items: center;
        }


        .circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
        }


        .c1 { background-color: #f4976c; }
        .c2 { background-color: #d2b4de; }
        .c3 { background-color: #d5dbdb; }
        .c4 { background-color: #d7bde2; }


        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
                overflow-y: auto;
            }


            .item1, .item2, .item3, .item4, .item5, .item6, .circles {
                grid-column: auto;
                grid-row: auto;
                height: 120px;
            }


            .circles {
                flex-direction: row;
                height: 80px;
            }
        }
    </style>
</head>
<body>


    <div class="grid-container">
        <div class="box item1"></div>
        <div class="box item2"></div>
        <div class="box item3"></div>
        <div class="box item4"></div>
        <div class="box item5"></div>
        <div class="box item6"></div>


        <div class="circles">
            <div class="circle c1"></div>
            <div class="circle c2"></div>
            <div class="circle c3"></div>
            <div class="circle c4"></div>
        </div>
    </div>


</body>
</html>
