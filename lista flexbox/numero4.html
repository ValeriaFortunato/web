<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gatinhos fofinhos questão 4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fff;
            overflow: hidden;
        }

        .gallery {
            display: flex;
            gap: 15px;
            width: 95%;
            max-width: 1100px;
            height: 450px;
            align-items: center;
        }

        .card {
            position: relative;
            flex: 1;
            height: 85%;
            border-radius: 40px;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            transition: all 0.5s ease;
            cursor: pointer;
        }

        .card:hover {
            flex: 4;
            height: 100%;
            border-radius: 50px;
        }

        .info {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: white;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 25px;
            border-radius: 35px;
            opacity: 0; 
            transition: opacity 0.3s ease;
        }

        .card:hover .info {
            opacity: 1;
        }

        .icon-circle {
            width: 40px;
            height: 40px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .card .icon-circle {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            transition: all 0.3s ease;
        }

        .card:hover .icon-circle {
            position: static;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="gallery">
        <div class="card" style="background-image: url('gatinho1.png');">
            <div class="info">
                <div class="icon-circle">🐱</div>
                <div style="font-weight: bold; font-size: 19px;">Gatinho Fofinho 1</div>
            </div>
            <div class="icon-circle">🐱</div>
        </div>

        <div class="card" style="background-image: url('gatinho2.png');">
            <div class="info">
                <div class="icon-circle">🐱</div>
                <div style="font-weight: bold; font-size: 19px;">Gatinho Fofinho 2</div>
            </div>
            <div class="icon-circle">🐱</div>
        </div>

        <div class="card" style="background-image: url('gatinho3.png');">
            <div class="info">
                <div class="icon-circle">🐱</div>
                <div style="font-weight: bold; font-size: 19px;">Gatinho Fofinho 3</div>
            </div>
            <div class="icon-circle">🐱</div>
        </div>

        <div class="card" style="background-image: url('gatinho4.png');">
            <div class="info">
                <div class="icon-circle">🐱</div>
                <div style="font-weight: bold; font-size: 19px;">Gatinho Fofinho 4</div>
            </div>
            <div class="icon-circle">🐱</div>
        </div>

        <div class="card" style="background-image: url('gatinho5.png');">
            <div class="info">
                <div class="icon-circle">🐱</div>
                <div style="font-weight: bold; font-size: 19px;">Gatinho Fofinho 5</div>
            </div>
            <div class="icon-circle">🐱</div>
        </div>
    </div>

</body>
</html>
