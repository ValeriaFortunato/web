<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Responsivo - Questão 4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            display: grid;
            min-height: 100vh;
            grid-template-areas: 
                "topo topo topo"
                "lateral-esq banner lateral-dir"
                "lateral-esq principal lateral-dir"
                "lateral-esq info-baixo lateral-dir"
                "rodape rodape rodape";
            
            grid-template-columns: 120px 1fr 120px;
            grid-template-rows: 80px 100px 1fr 100px 60px;
            gap: 5px; 
            padding: 5px;
        }

        .bloco {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            font-weight: bold;
            color: #333;
        }

        #Header { grid-area: topo; background-color: #FFB300; } 
        #Banner { grid-area: banner; background-color: #D32F2F; } 
        #Left   { grid-area: lateral-esq; background-color: #2E7D32; color: white; } 
        #Right  { grid-area: lateral-dir; background-color: #FFB300; } 
        #Main   { grid-area: principal; background-color: #4285F4; color: white; } 
        #Low    { grid-area: info-baixo; background-color: #2E7D32; color: white; }
        #Footer { grid-area: rodape; background-color: #4285F4; color: white; }

        @media (max-width: 650px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-areas: 
                    "topo"
                    "banner"
                    "lateral-esq"
                    "principal"
                    "lateral-dir"
                    "info-baixo"
                    "rodape";
                grid-template-rows: 60px 60px 60px 400px 60px 60px 60px;
            }
            
            .bloco { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="bloco" id="Header">Header</div>
        <div class="bloco" id="Banner">Banner</div>
        <div class="bloco" id="Left">Left Aside</div>
        <div class="bloco" id="Main">Main Content</div>
        <div class="bloco" id="Right">Right Aside</div>
        <div class="bloco" id="Low">Low Content</div>
        <div class="bloco" id="Footer">Footer</div>
    </div>

</body>
</html>
