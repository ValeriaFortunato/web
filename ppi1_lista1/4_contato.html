<!DOCTYPE html>
<html>
<head>
    <title>Contato</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #ffe6f0; color: #4b006e; font-family: Arial, sans-serif;">

<!-- Autor: Valeria Fortunato | Data: 20/03/2026 -->

<h1 style="color: #cc00cc;">Formulário de Contato</h1>

<p>
Preencha os campos abaixo corretamente para entrar em contato. Os campos obrigatórios devem ser preenchidos.
</p>

<a href="4_curriculo.html" style="color: #800080;">Voltar para o currículo</a>

<hr>

<form style="background-color: #fff0f5; padding: 15px; border-radius: 10px; width: 300px;">

    <label for="nome">Nome:</label><br>
    <input type="text" id="nome" placeholder="Digite seu nome" required 
    style="width: 100%; padding: 6px; border-radius: 6px;"><br><br>

    <label for="email">E-mail:</label><br>
    <input type="email" id="email" placeholder="Digite seu e-mail" required 
    style="width: 100%; padding: 6px; border-radius: 6px;"><br><br>

    <label for="assunto">Assunto:</label><br>
    <input type="text" id="assunto" placeholder="Digite o assunto" 
    style="width: 100%; padding: 6px; border-radius: 6px;"><br><br>

    <label for="estado">Estado:</label><br>
    <select id="estado" style="width: 100%; padding: 6px; border-radius: 6px;">
        <option value="">Selecione um estado</option>
        <option>Santa Catarina</option>
        <option>Paraná</option>
        <option>Rio Grande do Sul</option>
        <option>São Paulo</option>
    </select><br><br>

    <label for="mensagem">Mensagem:</label><br>
    <textarea id="mensagem" placeholder="Digite sua mensagem" 
    style="width: 100%; padding: 6px; border-radius: 6px;"></textarea><br><br>

    <button type="submit" 
    style="background-color: #cc00cc; color: white; border: none; padding: 8px; border-radius: 6px;">
        Enviar
    </button>

</form>

</body>
</html>
