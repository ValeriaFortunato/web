<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin:0px; padding: 0px;}
        body{border:1px solid red;
            min-height: 100vh;}
            
        .box{border:1px solid black;
            text-align : center;
            height:25vh;
            }
        #box1{background-color: blue;}
        #box2{background-color: green;}
        #box3{background-color: red;}
        #box4{background-color: yellow;}
    </style>
</head>
<body>
    <div id="box1" class="box">1</div>
    <div id="box2" class="box">2</div>
    <div id="box3" class="box">3</div>
    <div id="box4" class="box">4</div>
</body>
</html>

<!-- os elementos ficam um embaixo do outro porque a div é display: block
isso significa que cada elemento ocupa toda a largura da tela e sempre quebra linha automaticamente
por isso os 4 boxes aparecem um em cima do outro na vertical-->
