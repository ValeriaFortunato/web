<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{display:grid;
        grid-template-areas:"header header header"
                            "main empty sidebar"
                            "footer footer footer";
       height: 100vh;
    }
    #box1{background-color:orange;
        grid-area: header;
        border-radius: 10%;
        text-align:center;
    }
    #box2{
        background-color:rgb(96, 153, 189);
        grid-area: main;
        border-radius: 10%;
        text-align:center;
    }
   #box3{
        background-color:rgb(255, 255, 255);
        grid-area: empty;
        border-radius: 10%;
        text-align:center;
    }
    #box4{
        background-color:rgb(255, 0, 0);
        grid-area: sidebar;
        border-radius: 10%;
        text-align:center;
    }
    #box5{
        background-color:rgb(51, 255, 0);
        grid-area: footer;
        border-radius: 10%;
        text-align:center;
    }
</style>
<head>
    <div class="container">
        <div class="box" id="box1">1 - header</div>
        <div class="box" id="box2">2 - main</div>
        <div class="box" id="box3">3 - empty</div>
        <div class="box" id="box4">4 - sidebar</div>
        <div class="box" id="box5">5 - footer</div>
<body>
</body>
</html>
